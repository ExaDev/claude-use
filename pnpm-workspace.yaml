allowBuilds:
  esbuild: true

# @semantic-release/release-notes-generator pins conventional-changelog-writer to
# ^8.0.0, which predates the breaking Handlebars-to-render-function template rewrite that conventional-changelog-conventionalcommits@10.x now requires -- without this override, generateNotes silently produces an empty changelog body (just the version header, no Features/Bug Fixes sections). Confirmed upstream: https://github.com/semantic-release/release-notes-generator/issues/992
overrides:
  conventional-changelog-writer: ^9.2.0
  js-yaml: ^4.3.1
  nanoid: ^3.3.18
