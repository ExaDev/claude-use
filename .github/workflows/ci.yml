            exit 1
          }

  # Confirms `npx claude-use` genuinely works post-publish, on all three platforms — unlike the Homebrew/Scoop verify jobs above, this one channel is meant to work everywhere, so it gets a matrix rather than one job per OS. GitHub-hosted Windows runners ship Git Bash, so `shell: bash` here needs no PowerShell-specific branching.
  verify-npm:
    name: Verify npm install (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success'
    needs: [release, publish-npm]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Run via npx and check version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          # The registry can take a few moments to serve a version right after `npm publish` returns success, so retry rather than trusting the first attempt.
          #
          # Uses `-p ... claude-use` (the explicit command form) rather than the bare `npx claude-use@version` form: empirically, npm 11.17's bare-invocation heuristic for a multi-bin package picks the wrong bin (`claude`, not `claude-use`) even though npm's own documented rule says it should match the bin named after the package. The explicit form isn't ambiguous in the first place, so it isn't exposed to that bug.
          installed=""
          for i in $(seq 1 10); do
            if installed=$(npx --yes -p "claude-use@${expected}" claude-use --version 2>/dev/null); then
              break
            fi
            echo "npm registry not ready yet, retrying in 10s... ($i/10)"
            sleep 10
          done
          echo "$installed"
          if [ "$installed" != "$expected" ]; then
            echo "version mismatch: installed=$installed expected=$expected"
            exit 1
          fi
      # npx alone doesn't leave a stable, PATH-visible claude-use for a shim to attach to -- a real global install is needed for the round-trip below, distinct from the ephemeral npx invocation just proven above.
      - name: Global install for the shim round-trip
        shell: bash
        run: npm install -g "claude-use@${GITHUB_REF_NAME#v}"
      - name: Confirm claude is not installed by default
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo "error: 'claude' should not be on PATH after a fresh install -- found $(command -v claude)"
            exit 1
          fi
      # On macOS/Linux, an npm install's own dist/cli.cjs is directly executable via its shebang once hardlinked to a bare `claude`, so shim enable should succeed there. On Windows, an npm-installed claude-use runs under Node with no bundled .exe and no shebang-based dispatch, so shim enable must refuse with a clear error instead of producing a broken file -- both branches are asserted, not just hoped for.
      - name: shim enable/disable round-trip (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          claude-use shim enable
          # This runner has no real downstream Claude Code install, so invoking `claude` -- which always forwards straight into the launcher pipeline, never special-casing --version -- deterministically fails at binary discovery. That failure is itself the proof the shim file exists, is executable, and correctly dispatches into the launcher rather than crashing for some unrelated reason.
          if claude --version 2>err.log; then
            echo "error: 'claude' should not have found a downstream Claude Code binary in this CI environment"
            exit 1
          fi
          if ! grep -qi "Could not find a claude binary" err.log; then
            echo "error: 'claude' failed for an unexpected reason:"
            cat err.log
            exit 1
          fi
          claude-use shim disable
          # bash caches a resolved command's path in its hash table the first time it's invoked in this shell session (here, by the `claude --version` call above) -- command -v/type check that cache before the filesystem, so without clearing it a just-deleted file can still be reported as found.
          hash -r
          if command -v claude >/dev/null 2>&1; then
            echo "error: 'claude' should be gone after shim disable -- found $(command -v claude)"
            exit 1
          fi
      - name: shim enable correctly refuses (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if claude-use shim enable 2>err.log; then
            echo "error: shim enable should have refused on an npm-on-Windows install"
            exit 1
          fi
          if ! grep -qi "Cannot create a working" err.log; then
            echo "error: refused for an unexpected reason:"
            cat err.log
            exit 1
          fi

