  verify-scoop:
    name: Verify Scoop install (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success'
    needs: [release, update-scoop]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Scoop
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:USERPROFILE\scoop\shims\scoop.ps1")) {
            Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
            Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          }
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\scoop\shims"
      - name: Add bucket and install
        shell: pwsh
        run: |
          if (-not (scoop bucket list | Select-String -Quiet '^claude-use')) {
            scoop bucket add claude-use https://github.com/ExaDev/scoop-claude-use
          }
          scoop install claude-use
      - name: Check installed version matches the tag
        shell: pwsh
        run: |
          $installed = claude-use --version
          Write-Host $installed
          $expected = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($installed -ne $expected) {
            Write-Host "version mismatch: installed=$installed expected=$expected"
            exit 1
          }
      - name: Confirm claude is not installed by default
        shell: pwsh
        run: |
          if (Get-Command claude -ErrorAction SilentlyContinue) {
            Write-Host "error: 'claude' should not be on PATH after a fresh install"
            exit 1
          }
      - name: shim enable/disable round-trip
        shell: pwsh
        run: |
          claude-use shim enable
          # This runner has no real downstream Claude Code install, so invoking `claude` -- which always forwards straight into the launcher pipeline, never special-casing --version -- deterministically fails at binary discovery. That failure is itself the proof the shim file exists, is executable, and correctly dispatches into the launcher rather than crashing for some unrelated reason.
          $output = claude --version 2>&1 | Out-String
          Write-Host "claude --version exit code: $LASTEXITCODE"
          Write-Host "claude --version output: $output"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "error: 'claude' should not have found a downstream Claude Code binary in this CI environment"
            exit 1
          }
          if ($output -notmatch '(?i)Could not find a claude binary') {
            Write-Host "error: 'claude' failed for an unexpected reason:"
            Write-Host $output
            exit 1
          }
